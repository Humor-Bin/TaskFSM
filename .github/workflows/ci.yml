name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/server/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: apps/server
        run: pip install -r requirements-dev.txt
      - name: Test backend
        working-directory: apps/server
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Compile backend
        run: python -m compileall -q apps/server/taskfsm packages/agent-sdk-python/taskfsm_agent

  agent-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDK test dependencies
        run: pip install -e packages/agent-sdk-python pytest
      - name: Test Agent SDK
        working-directory: packages/agent-sdk-python
        env:
          PYTHONPATH: .
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test web console
        working-directory: apps/web
        run: npm test
      - name: Check web syntax
        working-directory: apps/web
        run: node --check src/app.mjs
