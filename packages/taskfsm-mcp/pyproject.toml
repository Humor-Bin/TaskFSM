[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskfsm-mcp"
version = "0.1.0"
description = "TaskFSM MCP tools for Codex CLI"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0,<2", "httpx>=0.27,<1"]

[project.scripts]
taskfsm-mcp = "taskfsm_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["taskfsm_mcp*"]
